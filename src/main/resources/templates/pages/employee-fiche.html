<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-card { border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .employee-details { margin-bottom: 20px; }
        .frappe-table { width: 100%; border-collapse: collapse; }
        .frappe-table th, .frappe-table td { padding: 8px; border: 1px solid #dee2e6; }
        .frappe-table th { background-color: #f8f9fa; }
        .no-result { font-style: italic; }
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0; padding: 0; }
            .frappe-card { border: none; box-shadow: none; padding: 0; }
        }
        .btn-link {
            color: inherit;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>

    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>

    <!-- Main content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Page header -->
            <div class="page-head">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item"><a href="/employee">Employee</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${employee != null} ? ${employee.name} : 'Employee Details'"></li>
                    </ol>
                </nav>
                <h1 class="page-title">Employee Details</h1>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <!-- Employee Details -->
            <div th:if="${employee}" class="frappe-card employee-details">
                <strong><h4 th:text="${employee.employeeName}"></h4></strong>
                <p><strong>ID:</strong> <span th:text="${employee.name}"></span></p>
                <p><strong>Department:</strong> <span th:text="${employee.department}"></span></p>
                <p><strong>Designation:</strong> <span th:text="${employee.designation}"></span></p>
                <p><strong>Status:</strong>
                    <span th:text="${employee.status}"
                          th:class="${employee.status == 'Active' ? 'indicator-pill green' : 
                                     employee.status == 'Inactive' ? 'indicator-pill gray' : 
                                     employee.status == 'Suspended' ? 'indicator-pill orange' : 
                                     employee.status == 'Left' ? 'indicator-pill red' : 'indicator-pill gray'}">
                    </span>
                </p>
                <p><strong>Gender:</strong> <span th:text="${employee.gender}"></span></p>
                <p><strong>Date of Birth:</strong> <span th:text="${#dates.format(employee.dateOfBirth, 'dd-MM-yyyy')}"></span></p>
                <p><strong>Date of Joining:</strong> <span th:text="${#dates.format(employee.dateOfJoining, 'dd-MM-yyyy')}"></span></p>
            </div>

            <!-- Salaries Table -->
            <div class="frappe-card">
                <h5>Monthly Salaries</h5>
                <table class="frappe-table">
                    <thead>
                        <tr>
                            <th scope="col">Salary Slip ID</th>
                            <th scope="col">Month</th>
                            <th scope="col">Year</th>
                            <th scope="col">Gross Pay</th>
                            <th scope="col">Total Deduction</th>
                            <th scope="col">Net Pay</th>
                            <th scope="col">Posting Date</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="salary : ${salaries}">
                            <td>
                                <a th:href="@{/employee/{employeeId}/payslip/{payslipId}(employeeId=${employee.name},payslipId=${#strings.replace(salary.name,'/','_')})}" 
                                th:text="${salary.name}" class="btn-link"></a>
                            </td>
                            <td th:text="${salary.month}"></td>
                            <td th:text="${salary.year}"></td>
                            <td th:text="${#numbers.formatDecimal(salary.grossPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="'-' + ${#numbers.formatDecimal(salary.totalDeduction, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(salary.netPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#dates.format(salary.postingDate, 'dd-MM-yyyy')}"></td>
                            <td>
                                <span th:text="${salary.status}"
                                    th:class="${salary.status == 'Submitted' ? 'indicator-pill blue' :
                                                salary.status == 'Generated' ? 'indicator-pill violet' :
                                                salary.status == 'Approved' ? 'indicator-pill green' :
                                                salary.status == 'Paid' ? 'indicator-pill dark-green' :
                                                salary.status == 'Pending' ? 'indicator-pill orange' :
                                                salary.status == 'Rejected' ? 'indicator-pill red' :
                                                salary.status == 'Cancelled' ? 'indicator-pill gray' :
                                                'indicator-pill gray'}">
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${salaries == null or salaries.isEmpty()}">
                            <td colspan="7" class="no-result text-muted text-center py-3">
                                No salary records found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
