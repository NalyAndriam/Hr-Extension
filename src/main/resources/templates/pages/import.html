<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Import Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .frappe-filter .form-control, .frappe-filter .form-select { height: 34px; font-size: 0.85rem; border-radius: 4px; }
        @media print { .no-print, .page-actions, .actions-col { display: none !important; } .main-content { margin-left: 0; padding: 0; } .frappe-card { border: none; box-shadow: none; padding: 0; } }
        .btn-link { color: inherit; text-decoration: none; font-size: 0.85rem; }
        .btn-link:hover { text-decoration: underline; }
        .import-form { margin-top: 15px; margin-bottom: 15px; }
        .import-results { margin-bottom: 15px; }
        .list-group-item-success { background-color: #e6ffed; border-color: #28a745; }
        .list-group-item-danger { background-color: #ffe6e6; border-color: #dc3545; }
        .reset-button { margin-left: 10px; }
    </style>
</head>
<body>
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>
    <div class="main-content">
        <div class="container-fluid">
            <div class="page-head">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/home">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Import</li>
                        </ol>
                    </nav>
                    <h1 class="page-title">Import data</h1>
                </div>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <form th:action="@{/reset-data}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm reset-button" onclick="return confirm('Are you sure you want to reset all data? This action cannot be undone.');">Reset Data</button>
            </form>
            <div class="frappe-card no-print import-form">
                <form th:action="@{/import}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="employeeCsvFile" class="form-label small">Upload Employee CSV</label>
                        <input type="file" class="form-control" id="employeeCsvFile" name="employeeCsvFile" accept=".csv">
                    </div>
                    <div class="mb-3">
                        <label for="salaryStructureCsvFile" class="form-label small">Upload Salary Structure CSV</label>
                        <input type="file" class="form-control" id="salaryStructureCsvFile" name="salaryStructureCsvFile" accept=".csv">
                    </div>
                    <div class="mb-3">
                        <label for="salarySlipCsvFile" class="form-label small">Upload Salary Slip CSV</label>
                        <input type="file" class="form-control" id="salarySlipCsvFile" name="salarySlipCsvFile" accept=".csv">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Import CSV</button>
                    
                </form>
            </div>
            <div th:if="${importResults}" class="import-results">
                <h5>Import Results</h5>
                <ul class="list-group">
                    <li th:each="result : ${importResults}" class="list-group-item"
                        th:class="${result.contains('successfully') ? 'list-group-item-success' : 'list-group-item-danger'}"
                        th:text="${result}"></li>
                </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
