<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Salary Evolution Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-card { border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .chart-container { max-width: 100%; margin: 0 auto; }
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0; padding: 0; }
            .frappe-card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>

    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>

    <!-- Main content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Page header -->
            <div class="page-head">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Salary Evolution Chart</li>
                    </ol>
                </nav>
                <h1 class="page-title">Salary Evolution by Month</h1>
            </div>

            <!-- Year Filter -->
            <div class="frappe-card no-print">
                <form th:action="@{/salaries/chart}" method="get" class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="year" class="form-label">Year:</label>
                    </div>
                    <div class="col-auto">
                        <select id="year" name="year" class="form-select">
                            <option value="">All Years</option>
                            <option th:each="yearOption : ${years}" 
                                    th:value="${yearOption}" 
                                    th:text="${yearOption}"
                                    th:selected="${yearOption == year}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </div>
                </form>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${chartData == null or chartData.months.empty and error == null}" 
                 class="alert alert-warning" role="alert">
                No salary data available for the selected year.
            </div>

            <!-- Chart -->
            <div th:if="${chartData != null and not chartData.months.empty}" class="frappe-card">
                <div class="chart-container">
                    <canvas id="salaryEvolutionChart"></canvas>
                </div>
                <div id="chart-data" th:attr="data-chart=${chartDataJson}" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script th:if="${chartData != null and not chartData.months.empty}">
        document.addEventListener('DOMContentLoaded', function() {
            try {
                const chartDataElement = document.getElementById('chart-data');
                const chartData = JSON.parse(chartDataElement.getAttribute('data-chart'));

                console.log('Parsed chart data:', chartData);
                console.log('Months:', chartData.months);
                console.log('Datasets:', chartData.datasets);
                chartData.datasets.forEach((ds, index) => {
                    console.log(`Dataset ${index}:`, {
                        label: ds.label,
                        data: ds.data,
                        borderColor: ds.borderColor,
                        backgroundColor: ds.backgroundColor,
                        fill: ds.fill,
                        tension: ds.tension,
                        hidden: ds.hidden
                    });
                });

                const chartTitle = chartData.year && chartData.year !== '' 
                    ? 'Salary Evolution by Month (' + chartData.year + ')' 
                    : 'Salary Evolution by Month';

                const ctx = document.getElementById('salaryEvolutionChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartData.months || [],
                        datasets: chartData.datasets || []
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    boxWidth: 20,
                                    padding: 15
                                }
                            },
                            title: {
                                display: true,
                                text: chartTitle
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Amount'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return value.toLocaleString();
                                    }
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Month'
                                }
                            }
                        }
                    }
                });
            } catch (e) {
                console.error('Error initializing chart:', e);
            }
        });
    </script>
</body>
</html>
