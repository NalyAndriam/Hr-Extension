<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Salary List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-card { border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .frappe-table { width: 100%; border-collapse: collapse; }
        .frappe-table th, .frappe-table td { padding: 8px; border: 1px solid #dee2e6; text-align: right; }
        .frappe-table th { background-color: #f8f9fa; }
        .frappe-table th:first-child, .frappe-table td:first-child { text-align: left; }
        .frappe-table th:nth-child(2), .frappe-table td:nth-child(2) { text-align: left; }
        .no-result { font-style: italic; text-align: center; }
        .details-table { margin-top: 10px; }
        .details-table th, .details-table td { padding: 6px; }
        .total-row { font-weight: bold; background-color: #e9ecef; }
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0; padding: 0; }
            .frappe-card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>

    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>

    <!-- Main content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Page header -->
            <div class="page-head">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Salary List</li>
                    </ol>
                </nav>
                <h1 class="page-title">Salary List</h1>
            </div>

            <!-- Filter -->
            <div class="frappe-card no-print">
                <form th:action="@{/salaries}" method="get" class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="monthYear" class="form-label">Month and Year:</label>
                    </div>
                    <div class="col-auto">
                        <input type="month" id="monthYear" name="monthYear" class="form-control" th:value="${monthYear}">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </div>
                </form>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${salarySummary == null or salarySummary.salaries.empty and error == null}" class="alert alert-warning" role="alert">
                No salary data available for the selected month and year.
            </div>

            <!-- Salary Table -->
            <div th:if="${salarySummary != null and not salarySummary.salaries.empty}" class="frappe-card">
                <table class="frappe-table" id="salary-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Name</th>
                            <th>Basic Salary</th>
                            <th>Deductions</th>
                            <th>Net Salary</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="salary, salaryStat : ${salarySummary.salaries}">
                            <td th:text="${salary.month + ' ' + salary.year}"></td>
                            <td th:text="${salary.employeeName}"></td>
                            <td th:text="${#numbers.formatDecimal(salary.grossPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(salary.totalDeduction, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(salary.netPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <button class="btn btn-link" 
                                        data-bs-toggle="collapse" 
                                        th:attr="data-bs-target='#details-' + ${salaryStat.index}">
                                    <i class="fas fa-info-circle"></i> Details
                                </button>
                                <div class="collapse details-table" 
                                     th:id="'details-' + ${salaryStat.index}">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th colspan="2">Earnings</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="earning : ${salary.earnings}">
                                                <td th:text="${earning.description}"></td>
                                                <td th:text="${#numbers.formatDecimal(earning.amount, 0, 'COMMA', 2, 'POINT')}"></td>
                                            </tr>
                                            <tr th:if="${salary.earnings == null or salary.earnings.empty}">
                                                <td colspan="2" class="no-result">No earnings components</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th colspan="2">Deductions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="deduction : ${salary.deductions}">
                                                <td th:text="${deduction.description}"></td>
                                                <td th:text="${#numbers.formatDecimal(deduction.amount, 0, 'COMMA', 2, 'POINT')}"></td>
                                            </tr>
                                            <tr th:if="${salary.deductions == null or salary.deductions.empty}">
                                                <td colspan="2" class="no-result">No deductions components</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                        </tr>
                        <!-- Totals Row -->
                        <tr class="total-row">
                            <td colspan="2">Total</td>
                            <td th:text="${#numbers.formatDecimal(salarySummary.totalGrossPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(salarySummary.totalDeductions, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(salarySummary.totalNetPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
