<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Filter Salary Slips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-card { border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .no-result { font-style: italic; text-align: center; }
        .form-group { margin-bottom: 1.5rem; } /* Vertical spacing between fields */
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0; padding: 0; }
            .frappe-card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>

    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>

    <!-- Main content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Page header -->
            <div class="page-head">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Filter Salary Slips</li>
                    </ol>
                </nav>
                <h1 class="page-title">Filter Salary Slips</h1>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <!-- Success message -->
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>

            <!-- Info message -->
            <div th:if="${info}" class="alert alert-info" role="alert">
                <span th:text="${info}"></span>
            </div>

            <!-- Form -->
            <div class="frappe-card no-print">
                <form th:action="@{/salaries/modif}" method="post" class="needs-validation" novalidate>
                    <!-- Salary Component -->
                    <div class="form-group">
                        <label for="components" class="form-label">Salary Components :</label>
                        <select id="components" name="component" class="form-select" required>
                            <option value="">Choose a component</option>
                            <option th:each="comp : ${components}"
                                    th:value="${comp.name}"
                                    th:text="${comp.name}"></option>
                        </select>
                    </div>

                    <!-- Comparison -->
                    <div class="form-group">
                        <label for="comparison" class="form-label">Comparison:</label>
                        <select class="form-select" id="comparison" name="comparison" required>
                            <option value="" disabled selected>Choose a condition</option>
                            <option value="inferior">Inferior to</option>
                            <option value="superior">Superior to</option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div class="form-group">
                        <label for="amount" class="form-label">Amount:</label>
                        <input type="number" class="form-control" id="amount" name="amount" min="0" step="0.01" required />
                    </div>

                    <!-- Adjustment
                    <div class="form-group">
                        <label for="adjustment" class="form-label">Adjustment:</label>
                        <select class="form-select" id="adjustment" name="adjustment" required>
                            <option value="" disabled selected>Choose an adjustment</option>
                            <option value="-">Minus</option>
                            <option value="+">Plus</option>
                        </select>
                    </div> -->

                    <!-- Percentage -->
                    <div class="form-group">
                        <label for="percentage" class="form-label">Percentage (%):</label>
                        <input type="number" class="form-control" id="percentage" name="percentage" required />
                    </div>

                    <!-- Submit Button -->
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Enable Bootstrap form validation
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
