<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext - Salary Totals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .frappe-card { border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .frappe-table { width: 100%; border-collapse: collapse; }
        .frappe-table th, .frappe-table td { padding: 8px; border: 1px solid #dee2e6; text-align: right; }
        .frappe-table th { background-color: #f8f9fa; }
        .frappe-table th:first-child, .frappe-table td:first-child { text-align: left; }
        .frappe-table th:nth-child(2), .frappe-table td:nth-child(2) { text-align: left; }
        .no-result { font-style: italic; text-align: center; }
        .total-row { font-weight: bold; background-color: #f8f9fa; }
        .details-table { margin-top: 10px; }
        .details-table th, .details-table td { padding: 6px; }
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0; padding: 0; }
            .frappe-card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}" class="no-print"></div>

    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar}" class="no-print"></div>

    <!-- Main content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Page header -->
            <div class="page-head">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Salary Totals</li>
                    </ol>
                </nav>
                <h1 class="page-title">Salary Totals by Month</h1>
            </div>

            <!-- Year Filter -->
            <div class="frappe-card no-print">
                <form th:action="@{/salaries/total}" method="get" class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="year" class="form-label">Year:</label>
                    </div>
                    <div class="col-auto">
                        <select id="year" name="year" class="form-select">
                            <option value="">All Years</option>
                            <option th:each="yearOption : ${years}" 
                                    th:value="${yearOption}" 
                                    th:text="${yearOption}"
                                    th:selected="${yearOption == year}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Filter</button>
                    </div>
                </form>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${salaryTotals == null or salaryTotals.empty and error == null}" 
                 class="alert alert-warning" role="alert">
                No salary data available for the selected year.
            </div>

            <!-- Salary Totals Table -->
            <div th:if="${salaryTotals != null and not salaryTotals.empty}" class="frappe-card">
                <table class="frappe-table" id="salary-totals-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Year</th>
                            <th>Basic Salary</th>
                            <th>Deductions</th>
                            <th>Net Salary</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="total : ${salaryTotals}">
                            <td th:text="${total.month}"></td>
                            <td th:text="${total.year}"></td>
                            <td th:text="${#numbers.formatDecimal(total.totalGrossPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(total.totalDeductions, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(total.totalNetPay, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <button class="btn btn-link" 
                                        data-bs-toggle="collapse" 
                                        th:attr="data-bs-target='#details-${total.month}-${total.year}'">
                                    <i class="fas fa-info-circle"></i> Details
                                </button>
                                <div class="collapse details-table" 
                                     th:id="'details-' + ${total.month} + '-' + ${total.year}">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th colspan="2">Earnings Components</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="entry : ${total.earningsDetails}">
                                                <td th:text="${entry.key}"></td>
                                                <td th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 2, 'POINT')}"></td>
                                            </tr>
                                            <tr th:if="${total.earningsDetails == null or total.earningsDetails.empty}">
                                                <td colspan="2" class="no-result">No earnings components</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th colspan="2">Deductions Components</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="entry : ${total.deductionsDetails}">
                                                <td th:text="${entry.key}"></td>
                                                <td th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 2, 'POINT')}"></td>
                                            </tr>
                                            <tr th:if="${total.deductionsDetails == null or total.deductionsDetails.empty}">
                                                <td colspan="2" class="no-result">No deductions components</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
