<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ERPNext Sidebar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Sidebar Fragment -->
<div th:fragment="sidebar" class="sidebar offcanvas offcanvas-start" tabindex="-1" id="sidebar">
    <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title">Main Menu</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <div class="sidebar-section-header">Navigation</div>
        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/home}" th:class="${activeMenu == 'home' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-home sidebar-icon"></i>
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a th:href="@{/import}" th:class="${activeMenu == 'import' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-file-csv sidebar-icon"></i>
                    <span>Data Import</span>
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/employee}" th:class="${activeMenu == 'employees' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-user sidebar-icon"></i> Employee List
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/salaries}" th:class="${activeMenu == 'salaries' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-dollar-sign sidebar-icon"></i> Salary Management
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/salaries/total}" th:class="${activeMenu == 'salary-total' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-chart-bar sidebar-icon"></i> Salary Analytics
                </a>
            </li>

 
            <!-- Sales Section (Optional - Uncomment if needed) -->
            <!--
            <li class="dropdown">
                <a href="#" class="sidebar-item dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fas fa-chart-line sidebar-icon"></i>
                    <span>Sales</span>
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Quotes</a></li>
                    <li><a class="dropdown-item" href="#">Orders</a></li>
                    <li><a class="dropdown-item" href="#">Invoices</a></li>
                    <li><a class="dropdown-item" href="#">Customers</a></li>
                </ul>
            </li>
            -->

        </ul>
    </div>

    <div class="sidebar-footer d-none d-lg-block">
        <span>ERPNext v14.0.3</span>
    </div>
</div>

<!-- Bootstrap & jQuery Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

</body>
</html>
