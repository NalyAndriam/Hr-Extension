<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ERPNext Sidebar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Sidebar Fragment -->
<div th:fragment="sidebar" class="sidebar offcanvas offcanvas-start" tabindex="-1" id="sidebar">
    <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title">Main Menu</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <div class="sidebar-section-header">Navigation</div>
        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/home}" th:class="${activeMenu == 'home' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-home sidebar-icon"></i>
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a th:href="@{/import}" th:class="${activeMenu == 'import' ? 'sidebar-item active' : 'sidebar-item'}">
                    <i class="fas fa-file-csv sidebar-icon"></i>
                    <span>Data Import</span>
                </a>
            </li>

            <!-- Human Resources Section -->
            <li class="dropdown">
                <a href="#" class="sidebar-item dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fas fa-users sidebar-icon"></i>
                    <span>Human Resources</span>
                </a>
                <ul class="dropdown-menu">
                    <li>
                        <a class="dropdown-item" th:href="@{/employee}" th:class="${activeMenu == 'employees' ? 'sidebar-item active' : 'sidebar-item'}">
                            <i class="fas fa-user sidebar-icon"></i> Employee List
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/salaries}" th:class="${activeMenu == 'salaries' ? 'sidebar-item active' : 'sidebar-item'}">
                            <i class="fas fa-dollar-sign sidebar-icon"></i> Salary Management
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/salaries/total}" th:class="${activeMenu == 'salary-total' ? 'sidebar-item active' : 'sidebar-item'}">
                            <i class="fas fa-coins sidebar-icon"></i> Total Payroll
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/salaries/chart}" th:class="${activeMenu == 'salary-chart' ? 'sidebar-item active' : 'sidebar-item'}">
                            <i class="fas fa-chart-bar sidebar-icon"></i> Salary Analytics
                        </a>
                    </li>
                </ul>
            </li>

            <!-- Sales Section (Optional - Uncomment if needed) -->
            <!--
            <li class="dropdown">
                <a href="#" class="sidebar-item dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fas fa-chart-line sidebar-icon"></i>
                    <span>Sales</span>
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Quotes</a></li>
                    <li><a class="dropdown-item" href="#">Orders</a></li>
                    <li><a class="dropdown-item" href="#">Invoices</a></li>
                    <li><a class="dropdown-item" href="#">Customers</a></li>
                </ul>
            </li>
            -->

        </ul>
    </div>

    <div class="sidebar-footer d-none d-lg-block">
        <span>ERPNext v14.0.3</span>
    </div>
</div>

<!-- Bootstrap & jQuery Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

<!-- Custom Script for Enhanced Dropdown Behavior -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const activeDropdownItems = document.querySelectorAll('.dropdown-item.active');
        activeDropdownItems.forEach(item => {
            const parentDropdown = item.closest('.dropdown');
            if (parentDropdown) {
                const dropdownToggle = parentDropdown.querySelector('.dropdown-toggle');
                const dropdownMenu = parentDropdown.querySelector('.dropdown-menu');
                dropdownToggle.classList.add('show');
                dropdownMenu.classList.add('show');
                adjustDropdownPosition(parentDropdown);
            }
        });

        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function (e) {
                e.preventDefault();
                const menu = this.nextElementSibling;
                const dropdown = this.closest('.dropdown');
                this.classList.toggle('show');
                menu.classList.toggle('show');

                if (menu.classList.contains('show')) {
                    adjustDropdownPosition(dropdown);
                }

                dropdownToggles.forEach(otherToggle => {
                    if (otherToggle !== toggle) {
                        otherToggle.classList.remove('show');
                        otherToggle.nextElementSibling.classList.remove('show');
                    }
                });
            });
        });

        function adjustDropdownPosition(dropdown) {
            if (!dropdown) return;

            const toggle = dropdown.querySelector('.dropdown-toggle');
            const menu = dropdown.querySelector('.dropdown-menu');

            if (toggle && menu) {
                menu.style.position = 'relative';
                menu.style.top = '0';
                menu.style.zIndex = '1';
            }
        }
    });
</script>
</body>
</html>
